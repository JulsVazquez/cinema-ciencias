server:
  port: 8089

spring:
  application:
    name: cinema-ciencias
  config:
    import: "optional:configserver:http://localhost:8888"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/cinema_ciencias
    username: multivac
    password: ItsAndru0!

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: cine-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jpa:
    hibernate:
      ddl-auto: update

  logging:
    level:
      org.apache.kafka: ERROR
      org.springframework.kafka:

# El JWT lo emite y lo valida el Auth Service / Gateway. Este servicio solo
# confía en el Gateway (patrón "Trust the Gateway"); el secreto compartido
# (cinema.security.gatewaySecret) lo sirve el Config Server desde shared-config.
microservices:
  audit:
    url: http://audit-service # se resuelve por Eureka (RestClient balanceado)